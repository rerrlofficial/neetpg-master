
name: Build NEET-PG Master APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          rm -rf workspace
          mkdir -p workspace

          unzip -q "$ZIP_FILE" -d workspace

          echo "Searching for Android project..."
          find workspace -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find workspace \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Configure Android Java and Kotlin targets
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP_GRADLE="app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found."
            exit 1
          fi

          cp "$APP_GRADLE" "${APP_GRADLE}.backup"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          # Remove the problematic Java --release configuration
          # that was added by the previous workflow.
          text = text.replace(
              """
          tasks.withType<JavaCompile>().configureEach {
              options.release.set(17)
          }
          """,
              ""
          )

          # Remove any previous generated Kotlin configuration.
          marker = "// NEET-PG Master build compatibility configuration"
          if marker in text:
              text = text[:text.index(marker)].rstrip() + "\n"

          # Android's supported Java compatibility configuration.
          android_config = """

          // NEET-PG Master: Android Java compatibility
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text += android_config

          # Kotlin JVM target configuration.
          kotlin_config = """

          // NEET-PG Master: Kotlin JVM compatibility
          kotlinOptions {
              jvmTarget = "17"
          }
          """

          if 'jvmTarget = "17"' not in text:
              text += kotlin_config

          path.write_text(text)

          print("Configured Android Java compatibility for JVM 17.")
          print("Configured Kotlin JVM target for JVM 17.")
          print("Removed unsupported Java --release configuration.")
          PY

          echo "Final Gradle configuration:"
          tail -n 35 "$APP_GRADLE"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK_FILE=$(find app/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neetpg-master-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
